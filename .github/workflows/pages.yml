# Dashboard Cuaca Aziz - publishes the web app (folder www/) to GitHub Pages on every push to main.
# One-time: repo Settings > Pages > Source: "GitHub Actions" (done).
name: Web app (GitHub Pages)

on:
  push:
    branches: [main]
    paths-ignore: ['mirror/**', '.github/workflows/mirror.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Mirror parser tests
        run: node tests/mirror.js
      - name: Mark as the web app
        run: sed -i 's/<html lang="ms"/<html lang="ms" data-web/' www/index.html
      - name: Offline file list (new version on every change)
        run: node tools/build-precache.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www
      - id: deployment
        uses: actions/deploy-pages@v4
