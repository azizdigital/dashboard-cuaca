# Temporary: raw samples of every data source for building the new app.
name: Site check
on:
  push:
    branches: [site-check]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./check.sh > log3.txt 2>&1; cat log3.txt
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A s3 s4 s5 s6 s7 s8 s9 frames.tsv log3.txt
          git commit -m "Samples [skip ci]"
          git push
