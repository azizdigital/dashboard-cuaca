# Temporary: raw samples of every data source for building the new app.
name: Site check
on:
  push:
    branches: [site-check]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./check.sh
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A samples2 log2.txt
          git commit -m "Samples [skip ci]"
          git push
