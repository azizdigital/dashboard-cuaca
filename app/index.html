<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dashboard Cuaca Aziz</title>
<meta name="theme-color" content="#0b111b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cuaca Aziz">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header class="top">
  <div class="brand"><img src="icons/icon-64.png" alt="" width="28" height="28"><b>Dashboard Cuaca Aziz</b></div>
  <nav class="chips" id="profiles" aria-label="Locations"></nav>
  <div class="tools">
    <span id="updated" class="muted"></span>
    <button id="refresh" class="ibtn" title="Refresh" aria-label="Refresh">⟳</button>
    <button id="lang" class="ibtn txt">BM</button>
    <button id="gear" class="ibtn" title="Settings" aria-label="Settings">⚙</button>
  </div>
</header>
<div id="alerts" aria-live="polite"></div>
<main>
  <div class="grid3">
    <article class="card" id="cNow"></article>
    <article class="card" id="cWarn"></article>
    <article class="card" id="cTide"></article>
  </div>
  <div class="grid2">
    <article class="card" id="cFc"></article>
    <article class="card" id="cSea"></article>
  </div>
  <article class="card" id="cMet"></article>
  <article class="card" id="cWater"></article>
  <article class="card" id="cRain"></article>
  <section id="sites"></section>
  <footer id="foot" class="muted"></footer>
</main>
<div id="viewer" hidden>
  <div class="vbar">
    <button id="vBack" class="btn">← <span>Back</span></button>
    <b id="vTitle"></b>
    <button id="vReload" class="ibtn" title="Reload" aria-label="Reload">⟳</button>
    <a id="vOpen" class="ibtn" target="_blank" rel="noopener" title="Open the site" aria-label="Open the site">↗</a>
  </div>
  <iframe id="vFrame" title="Site" allow="fullscreen; geolocation" referrerpolicy="strict-origin-when-cross-origin"></iframe>
</div>
<dialog id="settings"><button id="setClose" class="ibtn close" aria-label="Close">✕</button><div id="setBody"></div></dialog>
<script src="js/data.js"></script>
<script src="js/sites.js"></script>
<script src="js/charts.js"></script>
<script src="js/app.js"></script>
</body>
</html>
