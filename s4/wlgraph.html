//Ticket #JPS-F2-01196
function expPDF2() {
    const table = document.getElementById('dataTable');
    const rows = Array.from(table.querySelectorAll('tr')).map(row =>
        Array.from(row.querySelectorAll('th, td')).map(cell => ({
            text: cell.innerText,
            backgroundColor: window.getComputedStyle(cell).backgroundColor // Get background color
        }))
    );

    const pdf = new jsPDF('p', 'mm', 'a4'); // 'p' for portrait
    const margin = 10;
    const bottomMargin = 25; // Reserved space at the bottom of the page
    const headerHeight = 15; // Height for the table header row
    const pageWidth = pdf.internal.pageSize.width;
    const pageHeight = pdf.internal.pageSize.height;
    const cellPadding = 5;
    const headerColor = [176, 196, 222]; // Light steel blue
    const cellHeight = 10;
    const title = 'Public Portal - Hydrograph'; // Title matching filename
    let yPosition = margin + headerHeight + 15; // Adjust position to account for the title
    let currentPage = 1; // Track the current page

    // Function to add a page number at the bottom-right of each page
    function addPageNumber(pageNumber) {
        pdf.setFont('helvetica', 'normal');
        pdf.setFontSize(10);
        const text = `${pageNumber}`;
        pdf.text(text, pageWidth - margin - pdf.getTextWidth(text), pageHeight - 10); // Bottom-right position
    }

    // Add title to the first page
    pdf.setFont('helvetica', 'bold');
    pdf.setFontSize(16);
    const titleWidth = pdf.getTextWidth(title);
    pdf.text(title, pageWidth / 2 - titleWidth / 2, margin + 10); // Center the title
    addPageNumber(currentPage); // Add page number to the first page

    // Calculate column widths dynamically
    const columnWidths = rows[0].map((_, colIndex) => {
        const maxTextWidth = Math.max(
            ...rows.map(row => pdf.getTextWidth(row[colIndex].text || ''))
        );
        return maxTextWidth + cellPadding * 2; // Add padding
    });

    // Ensure the table fits within the page width
    const totalWidth = columnWidths.reduce((acc, width) => acc + width, 0);
    if (totalWidth > pageWidth - margin * 2) {
        const scale = (pageWidth - margin * 2) / totalWidth;
        columnWidths.forEach((width, index) => (columnWidths[index] *= scale));
    }

    // Function to draw the table header
    function drawTableHeader() {
        let xPosition = margin;
        rows[0].forEach((headerCell, colIndex) => {
            const cellWidth = columnWidths[colIndex];
            pdf.setFillColor(...headerColor); // Header background color
            pdf.rect(xPosition, yPosition, cellWidth, cellHeight, 'F');

            // Center-align text
            const textWidth = pdf.getTextWidth(headerCell.text);
            const textX = xPosition + cellWidth / 2 - textWidth / 2; // Center horizontally
            const textY = yPosition + cellHeight / 2 + 3; // Center vertically
            pdf.setTextColor(0, 0, 0); // Black text
            pdf.setFont('helvetica', 'bold');
            pdf.text(headerCell.text, textX, textY, { baseline: 'middle' });

            // Draw cell border
            pdf.rect(xPosition, yPosition, cellWidth, cellHeight);

            xPosition += cellWidth;
        });
        yPosition += cellHeight; // Move to the next row
    }

    // Draw the table header on the first page
    drawTableHeader();

    // Draw the table rows
    rows.slice(1).forEach(row => {
        let xPosition = margin;

        row.forEach((cell, colIndex) => {
            const cellWidth = columnWidths[colIndex];
            const { text, backgroundColor } = cell;

            // Determine background color
            if (backgroundColor !== 'rgba(0, 0, 0, 0)') {
                const rgb = backgroundColor.match(/\d+/g).map(Number); // Extract RGB values
                pdf.setFillColor(rgb[0], rgb[1], rgb[2]);
            } else {
                pdf.setFillColor(255, 255, 255); // Default white background
            }

            // Draw cell background
            pdf.rect(xPosition, yPosition, cellWidth, cellHeight, 'F');

            // Center-align text
            const textWidth = pdf.getTextWidth(text);
            const textX = xPosition + cellWidth / 2 - textWidth / 2;
            const textY = yPosition + cellHeight / 2 + 3;
            pdf.setTextColor(0, 0, 0);
            pdf.setFont('helvetica', 'normal');
            pdf.text(text, textX, textY, { baseline: 'middle' });

            // Draw cell border
            pdf.rect(xPosition, yPosition, cellWidth, cellHeight);

            xPosition += cellWidth;
        });

        yPosition += cellHeight;

        // Handle page overflow (consider bottom margin)
        if (yPosition > pageHeight - bottomMargin) {
            pdf.addPage();
            currentPage++;
            yPosition = margin + headerHeight; // Reset position for the new page
            addPageNumber(currentPage); // Add page number to the new page
            drawTableHeader(); // Draw the table header on the new page
        }
    });

    pdf.save(`${title}.pdf`);
}


 //csv function
 function excel() {
    const table = document.getElementById('dataTable'); // Replace with your table ID
    const rows = Array.from(table.querySelectorAll('tr'));

    // Add a header title to the CSV content
    const headerTitle = '"Public Portal - Hydrograph"\n\n'; // Customize the title as needed

    // Convert table rows into CSV format
    const csvContent = rows.map(row => {
        const cells = Array.from(row.querySelectorAll('th, td'));
        return cells.map(cell => `"${cell.innerText.replace(/"/g, '""')}"`).join(','); // Escape double quotes
    }).join('\n');

    // Combine header title with the table content
    const fullCsvContent = headerTitle + csvContent;

    // Create a Blob for the CSV content
    const blob = new Blob([fullCsvContent], { type: 'text/csv;charset=utf-8;' });

    // Create a link to trigger the download
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = 'Public Portal - Hydrograph.csv'; // Set desired filename

    Date.daysBetween = function(date1, date2) {
        //Get 1 day in milliseconds
        var one_day = 1000 * 60 * 60 * 24;

        // Convert both dates to milliseconds
        var date1_ms = date1.getTime();
        var date2_ms = date2.getTime();

        // Calculate the difference in milliseconds
        var difference_ms = date2_ms - date1_ms;
        //take out milliseconds
        difference_ms = difference_ms / 1000;
        var seconds = Math.floor(difference_ms % 60);
        difference_ms = difference_ms / 60;
        var minutes = Math.floor(difference_ms % 60);
        difference_ms = difference_ms / 60;
        var hours = Math.floor(difference_ms % 24);
        var days = Math.floor(difference_ms / 24);

        //return days + ' days, ' + hours + ' hours, ' + minutes + ' minutes, and ' + seconds + ' seconds';
        return days;
    }

        Chart.controllers.LineWithLine = Chart.controllers.line.extend({
            draw: function(ease) {
                Chart.controllers.line.prototype.draw.call(this, ease);

                if (this.chart.tooltip._active && this.chart.tooltip._active.length) {
                    var activePoint = this.chart.tooltip._active[0],
                        ctx = this.chart.ctx,
                        x = activePoint.tooltipPosition().x,
                        topY = this.chart.scales['yAxis'].top,
                        bottomY = this.chart.scales['yAxis'].bottom;

                    // draw line
                    ctx.save();
                    ctx.beginPath();
                    ctx.moveTo(x, topY);
                    ctx.lineTo(x, bottomY);
                    ctx.lineWidth = 1;
                    ctx.strokeStyle = '#000';
                    ctx.stroke();
                    ctx.restore();
                }
            }
        });
