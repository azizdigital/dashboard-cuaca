<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Cuaca Aziz - Memuatkan</title>
<!-- Same splash as OIM Wazira: 5 seconds, logo, name, loading bar, copyright. Desktop: own 500x300 window. Phone: full screen. -->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body, html { height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', 'Roboto', 'Helvetica Neue', Arial, sans-serif; background: #121212; color: #fff; }
  .splash-container { display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; width: 100vw; padding-bottom: 40px;
    background: linear-gradient(135deg, #121212 0%, #1a1a1a 100%); animation: fadeIn .8s ease-out; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
  .logo { width: 120px; height: 120px; object-fit: contain; margin-bottom: 18px; border-radius: 26px; box-shadow: 0 10px 30px rgba(0,0,0,.45); animation: logoFadeIn 1.2s ease-out .3s both; }
  @keyframes logoFadeIn { from { opacity: 0; transform: scale(.8); } to { opacity: 1; transform: scale(1); } }
  .app-name { font-size: 1.8rem; font-weight: 700; letter-spacing: -.02em; margin-bottom: 8px; text-align: center;
    background: linear-gradient(135deg, #ffffff 0%, #e0e0e0 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    animation: textFadeIn 1s ease-out .6s both; }
  @keyframes textFadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  .subtext { font-size: .9rem; color: #b0b0b0; text-align: center; animation: textFadeIn 1s ease-out .9s both; }
  .spinner-container { position: absolute; bottom: 80px; left: 50%; transform: translateX(-50%); width: 180px; animation: spinnerFadeIn 1s ease-out 1.2s both; }
  @keyframes spinnerFadeIn { from { opacity: 0; } to { opacity: 1; } }
  .loading-bar { width: 100%; height: 3px; background: rgba(255,255,255,.1); border-radius: 2px; overflow: hidden; }
  .loading-bar-progress { height: 100%; background: linear-gradient(90deg, #1e6fd9 0%, #4fc3f7 100%); border-radius: 2px; animation: loadingProgress 5s ease-out forwards; }
  @keyframes loadingProgress { 0% { width: 0%; } 90% { width: 85%; } 100% { width: 100%; } }
  .copyright { position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%); text-align: center; font-size: .8rem; color: #888; line-height: 1.3; white-space: nowrap;
    animation: copyrightFadeIn 1.5s ease-out 2s both; }
  @keyframes copyrightFadeIn { from { opacity: 0; } to { opacity: .9; } }
  /* the desktop splash window is 500 x 300 */
  @media (max-height: 350px) {
    .splash-container { padding-bottom: 46px; }
    .logo { width: 84px; height: 84px; margin-bottom: 10px; border-radius: 18px; }
    .app-name { font-size: 1.4rem; margin-bottom: 4px; }
    .subtext { font-size: .8rem; }
    .spinner-container { width: 140px; bottom: 50px; }
    .copyright { font-size: .7rem; bottom: 8px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .splash-container, .logo, .app-name, .subtext, .spinner-container, .copyright { animation-duration: .01ms; animation-iteration-count: 1; }
    .loading-bar-progress { animation: none; width: 75%; background: #1e6fd9; }
  }
</style>
</head>
<body>
  <div class="splash-container">
    <img src="assets/icons/icon-256.png" alt="Logo Dashboard Cuaca Aziz" class="logo">
    <h1 class="app-name">Dashboard Cuaca Aziz</h1>
    <p class="subtext">Memuatkan, sila tunggu...</p>
    <div class="copyright">
      <div>© 2026 Aziz Mohamad</div>
      <div>Monitoring &amp; Analysis Division</div>
    </div>
  </div>
  <div class="spinner-container"><div class="loading-bar"><div class="loading-bar-progress"></div></div></div>
  <script src="assets/js/i18n.js"></script>
</body>
</html>
